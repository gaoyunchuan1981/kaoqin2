<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="g4_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="g4_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g4_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g4_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="ribbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景超圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bg4)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="url(#ribbonGlow)"/>

  <!-- 4向交织胶囊纽带 (时钟协同罗盘) -->
  <g transform="translate(256, 256)" filter="url(#shadow4)">
    <!-- 北 (全勤 绿) -->
    <rect x="-32" y="-170" width="64" height="140" rx="32" fill="url(#g4_green)"/>
    <circle cx="0" cy="-138" r="12" fill="#FFFFFF" opacity="0.8"/>

    <!-- 东 (排班 蓝) -->
    <rect x="30" y="-32" width="140" height="64" rx="32" fill="url(#g4_cyan)"/>
    <circle cx="138" cy="0" r="12" fill="#FFFFFF" opacity="0.8"/>

    <!-- 南 (调休 紫) -->
    <rect x="-32" y="30" width="64" height="140" rx="32" fill="url(#g4_purple)"/>
    <circle cx="0" cy="138" r="12" fill="#FFFFFF" opacity="0.8"/>

    <!-- 西 (工时 橙) -->
    <rect x="-170" y="-32" width="140" height="64" rx="32" fill="url(#g4_amber)"/>
    <circle cx="-138" cy="0" r="12" fill="#FFFFFF" opacity="0.8"/>

    <!-- 中心时钟圆盘 -->
    <circle cx="0" cy="0" r="48" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="42" fill="#0F172A"/>
    <!-- 时钟指针 ( 指向 10:10 黄金办公时刻 ) -->
    <line x1="0" y1="0" x2="-14" y2="-18" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="-14" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
</svg>
