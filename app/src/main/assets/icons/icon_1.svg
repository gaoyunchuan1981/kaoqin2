<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#4FACFE"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00F2FE" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景超圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bg1)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="url(#glow1)"/>
  <!-- 极光时钟闭环 -->
  <path d="M 256 96 A 160 160 0 1 1 96 256" fill="none" stroke="url(#ring1)" stroke-width="46" stroke-linecap="round" filter="url(#shadow1)"/>
  <path d="M 112 216 A 160 160 0 0 1 230 96" fill="none" stroke="#00F2FE" stroke-width="46" stroke-linecap="round" stroke-dasharray="8 64"/>
  <!-- 华星璀璨星芒光核 -->
  <path d="M 256 160 Q 256 256 160 256 Q 256 256 256 352 Q 256 256 352 256 Q 256 256 256 160 Z" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="18" fill="#00F2FE"/>
</svg>
