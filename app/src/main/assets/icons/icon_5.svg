<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#021C16"/>
    </linearGradient>
    <linearGradient id="pillar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="pillar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pillar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="stepperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景超圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bg5)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="170" fill="url(#stepperGlow)"/>

  <!-- 3 阶递进工时阶梯 -->
  <g filter="url(#shadow5)">
    <!-- 柱 1 (基石工时: 8h) -->
    <rect x="120" y="260" width="60" height="120" rx="30" fill="url(#pillar1)"/>
    <!-- 柱 2 (加班积攒: 16h) -->
    <rect x="226" y="190" width="60" height="190" rx="30" fill="url(#pillar2)"/>
    <!-- 柱 3 (调休蓄水池: 24h) -->
    <rect x="332" y="120" width="60" height="260" rx="30" fill="url(#pillar3)"/>

    <!-- 腾飞跃迁弧线 (工时兑换为调休假) -->
    <path d="M 85 320 C 140 100 280 40 410 115" fill="none" stroke="url(#arcGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 弧线顶端星芒 -->
  <g transform="translate(410, 115)">
    <path d="M 0 -36 Q 0 0 -36 0 Q 0 0 0 36 Q 0 0 36 0 Q 0 0 0 -36 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
</svg>
