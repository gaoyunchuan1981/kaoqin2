<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#FB923C"/>
      <stop offset="85%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#FB923C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景超圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bg3)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="360" cy="150" r="140" fill="url(#starGlow)"/>

  <!-- 动感打卡勾 (流线型勾标) -->
  <g filter="url(#shadow3)">
    <path d="M 120 270 L 205 355 C 220 370 245 370 260 350 L 395 160" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- 星芒徽记 (极光签到星) -->
  <g transform="translate(395, 150)">
    <path d="M 0 -60 Q 0 0 -60 0 Q 0 0 0 60 Q 0 0 60 0 Q 0 0 0 -60 Z" fill="#FACC15"/>
    <path d="M 0 -40 Q 0 0 -40 0 Q 0 0 0 40 Q 0 0 40 0 Q 0 0 0 -40 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="10" fill="#FB923C"/>
  </g>
  <!-- 辅助打卡光点 -->
  <circle cx="120" cy="270" r="12" fill="#F43F5E"/>
</svg>
