<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <!-- 顶面：年假/全勤 祖母绿翡翠渐变 -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- 左面：病假/事假 玫瑰珊瑚霓虹渐变 -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <!-- 右面：调休/加班 极光紫罗兰深空渐变 -->
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <!-- 核心光感 -->
    <radialGradient id="cubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#9333EA" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景超圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bg2)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="180" fill="url(#cubeGlow)"/>

  <!-- 等距魔方投影主体 (居中 256, 256) -->
  <g transform="translate(256, 256)" filter="url(#shadow2)">
    <!-- 顶面 (年假 / 绿色平衡) -->
    <path d="M 0 -130 L 124 -58 L 0 14 L -124 -58 Z" fill="url(#facetTop)"/>
    <path d="M 0 -130 L 124 -58 L 0 14 L -124 -58 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
    
    <!-- 左面 (病假 / 珊瑚绯红) -->
    <path d="M -124 -58 L 0 14 L 0 156 L -124 84 Z" fill="url(#facetLeft)"/>
    <path d="M -124 -58 L 0 14 L 0 156 L -124 84 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    
    <!-- 右面 (调休 / 极光紫) -->
    <path d="M 0 14 L 124 -58 L 124 84 L 0 156 Z" fill="url(#facetRight)"/>
    <path d="M 0 14 L 124 -58 L 124 84 L 0 156 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

    <!-- 内部透光几何晶核 (华星 H 晶柱) -->
    <path d="M -44 -26 L 44 -76 L 44 26 L -44 76 Z" fill="rgba(255,255,255,0.28)"/>
    <circle cx="0" cy="14" r="16" fill="#FFFFFF"/>
    <circle cx="0" cy="14" r="8" fill="#38BDF8"/>
  </g>
</svg>
